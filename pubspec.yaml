name: myfish
description: "MyFish — monitoring & kontrol pemberi pakan ikan otomatis berbasis ESP32."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  image_gallery_saver_plus: ^5.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  slide_to_act: ^2.0.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/images/myfish.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/myfish.png"
